  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  .login-box .err{color:#c0392b;font-size:12px;margin-top:8px;display:none;}

function tryLogin(){

    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';

}

let state = null;
const TABS = [
  {key:'meta', label:'기본정보'},
  {key:'hero', label:'히어로'},
  {key:'intro', label:'프로젝트 소개'},
  {key:'fields', label:'모집분야'},
  {key:'journey', label:'프로그램 여정'},
  {key:'board', label:'지원안내'},
  {key:'gallery', label:'갤러리'},
  {key:'footer', label:'푸터'}
];
let currentTab = 'hero';

async function boot(){
  try{
    const draft = localStorage.getItem(DRAFT_KEY);
    if(draft){ state = JSON.parse(draft); }
    else {
      const res = await fetch('data.json', {cache:'no-store'});
      state = res.ok ? await res.json() : JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
  }catch(e){ state = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  buildSidebar();
  renderTab(currentTab);
}
function resetToDefault(){
  if(!confirm('현재 편집 중인 모든 내용을 기본값으로 되돌립니다. 계속할까요?')) return;
  state = JSON.parse(JSON.stringify(DEFAULT_DATA));
  renderTab(currentTab);
  flash('기본값으로 초기화되었습니다 (아직 임시저장 전)');
}
function buildSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = TABS.map(t=>`<button data-tab="${t.key}" class="${t.key===currentTab?'active':''}">${t.label}</button>`).join('');
  sb.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ currentTab = b.dataset.tab; buildSidebar(); renderTab(currentTab); });
  });
}
function flash(msg){
  const el = document.getElementById('saveMsg');
  el.textContent = msg; el.style.opacity = '1';
  setTimeout(()=> el.style.opacity='0', 1800);
}
function saveDraft(){
  localStorage.setItem(DRAFT_KEY, JSON.stringify(state));
  document.getElementById('previewFrame').src = 'index.html?preview=1&t=' + Date.now();
  flash('임시저장됨 · 미리보기 갱신');
}
function exportJson(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'data.json'; a.click();
  URL.revokeObjectURL(url);
  flash('data.json 다운로드됨');
}

/* ---------- helpers ---------- */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function field(labelText, inputHtml){ return `<div class="field"><label>${labelText}</label>${inputHtml}</div>`; }
function bindInput(sel, path, isArray, delim){
  document.querySelectorAll(sel).forEach(inp=>{
    inp.addEventListener('input', ()=>{
      let val = inp.value;
      if(isArray) val = val.split(delim||'\n').map(s=>s.trim()).filter(Boolean);
      setPath(state, path, val);
    });
  });
}
function setPath(obj, path, val){
  const keys = path.split('.');
  let cur = obj;
  for(let i=0;i<keys.length-1;i++){
    let k = keys[i];
    if(k.includes('[')){
      const [base, idx] = k.split('[');
      cur = cur[base][parseInt(idx)];
    } else cur = cur[k];
  }
  let lastKey = keys[keys.length-1];
  if(lastKey.includes('[')){
    const [base, idx] = lastKey.split('[');
    cur[base][parseInt(idx)] = val;
  } else cur[lastKey] = val;
}
function getPath(obj, path){
  const keys = path.split('.');
  let cur = obj;
  for(const k of keys){
    if(k.includes('[')){
      const [base, idx] = k.split('[');
      cur = cur[base][parseInt(idx)];
    } else cur = cur[k];
  }
  return cur;
}

/* ---------- background editor component ---------- */
function bgEditorHtml(sectionKey){
  const bg = state.sections[sectionKey].bg;
  return `
  <div class="bg-editor">
    <div class="field">
      <label>섹션 배경 유형</label>
      <select id="bgtype-${sectionKey}">
        <option value="gradient" ${bg.type==='gradient'?'selected':''}>기본 그라디언트</option>
        <option value="image" ${bg.type==='image'?'selected':''}>이미지</option>
        <option value="video" ${bg.type==='video'?'selected':''}>동영상 (mp4 URL)</option>
        <option value="youtube" ${bg.type==='youtube'?'selected':''}>유튜브 영상</option>
      </select>
    </div>
    <div class="field" id="bgurl-wrap-${sectionKey}" style="display:${bg.type==='gradient'?'none':'block'}">
      <label>URL 또는 파일 업로드</label>
      <input type="text" id="bgurl-${sectionKey}" placeholder="https://... 이미지/영상/유튜브 링크" value="${(bg.url||'').replace(/"/g,'&quot;')}">
      <div class="hint" id="bghint-${sectionKey}"></div>
      <input type="file" accept="image/*" id="bgfile-${sectionKey}" style="margin-top:8px;display:${bg.type==='image'?'block':'none'}">
    </div>
    <div class="field">
      <label>어두운 오버레이 (텍스트 가독성)</label>
      <div class="range-row">
        <input type="range" min="0" max="0.8" step="0.05" id="bgov-${sectionKey}" value="${bg.overlay!=null?bg.overlay:0.35}">
        <span id="bgov-val-${sectionKey}">${Math.round((bg.overlay!=null?bg.overlay:0.35)*100)}%</span>
      </div>
    </div>
  </div>`;
}
function bindBgEditor(sectionKey){
  const typeSel = document.getElementById(`bgtype-${sectionKey}`);
  const urlWrap = document.getElementById(`bgurl-wrap-${sectionKey}`);
  const urlInput = document.getElementById(`bgurl-${sectionKey}`);
  const fileInput = document.getElementById(`bgfile-${sectionKey}`);
  const ovInput = document.getElementById(`bgov-${sectionKey}`);
  const ovVal = document.getElementById(`bgov-val-${sectionKey}`);
  const hint = document.getElementById(`bghint-${sectionKey}`);
  const hints = {
    image:'고화질 이미지 URL을 붙여넣거나, 아래에서 파일을 직접 업로드하세요 (업로드 파일은 저장 시 페이지에 포함됩니다).',
    video:'mp4로 인코딩된 동영상 파일의 URL을 입력하세요 (예: GitHub/구글드라이브 직접링크, 자체 호스팅 등). 대용량 파일은 파일 업로드를 지원하지 않으니 URL을 사용하세요.',
    youtube:'유튜브 영상 URL을 붙여넣으세요 (예: https://youtu.be/xxxx). 자동 재생·반복 배경으로 표시됩니다.',
    gradient:''
  };
  hint.textContent = hints[state.sections[sectionKey].bg.type] || '';
  typeSel.addEventListener('change', ()=>{
    const t = typeSel.value;
    state.sections[sectionKey].bg.type = t;
    urlWrap.style.display = t==='gradient' ? 'none' : 'block';
    fileInput.style.display = t==='image' ? 'block' : 'none';
    hint.textContent = hints[t] || '';
  });
  urlInput.addEventListener('input', ()=>{ state.sections[sectionKey].bg.url = urlInput.value; });
  fileInput.addEventListener('change', ()=>{
    const f = fileInput.files[0];
    if(!f) return;
    if(f.size > 3*1024*1024){ alert('이미지는 3MB 이하 파일을 권장합니다. 더 큰 파일은 URL 방식을 사용해주세요.'); }
    const reader = new FileReader();
    reader.onload = ()=>{ state.sections[sectionKey].bg.url = reader.result; urlInput.value = '(업로드된 이미지)'; };
    reader.readAsDataURL(f);
  });
  ovInput.addEventListener('input', ()=>{
    state.sections[sectionKey].bg.overlay = parseFloat(ovInput.value);
    ovVal.textContent = Math.round(ovInput.value*100)+'%';
  });
}

/* ---------- list editor helper (figures, stats, cards, steps, rows, items, columns) ---------- */
function renderListEditor(containerId, arrPath, itemRenderer, emptyItem, label){
  const arr = getPath(state, arrPath);
  const container = document.getElementById(containerId);
  container.innerHTML = arr.map((item, i)=> itemRenderer(item, i)).join('') +
    `<button class="add-btn" id="${containerId}-add">+ ${label} 추가</button>`;
  document.getElementById(`${containerId}-add`).addEventListener('click', ()=>{
    arr.push(JSON.parse(JSON.stringify(emptyItem)));
    renderListEditor(containerId, arrPath, itemRenderer, emptyItem, label);
    bindCurrentTabInputs();
  });
  container.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      arr.splice(parseInt(btn.dataset.remove), 1);
      renderListEditor(containerId, arrPath, itemRenderer, emptyItem, label);
      bindCurrentTabInputs();
    });
  });
}

    <div class="hint" style="font-size:11.5px;color:var(--ink-3);margin-top:10px;">푸터 메뉴 링크 구성은 현재 코드 기본값을 사용합니다. 문구 변경이 필요하면 알려주세요.</div>`;
}
function esc(str){ return String(str==null?'':str).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
</script>
