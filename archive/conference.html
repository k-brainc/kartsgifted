<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K예술영재 프로젝트 — 교강사 회의록·녹취 아카이브</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

<!--
  ════════════════════════════════════════════════════════════════
  설정 방법 (종현님 전용 안내)
  ════════════════════════════════════════════════════════════════
  1) 구글 시트의 헤더(1행)에는 어떤 컬럼이 있어도 됩니다 (순번/회의명/분야/일차/차시/날짜 등 자유롭게).
     단, "분야" 컬럼 값은 반드시 무용/미술/음악/전통예술 중 하나와 정확히 일치해야 하고,
     회의록·녹취 링크가 들어갈 컬럼명에는 "회의록", "녹취"라는 단어가 포함되어 있어야 합니다.
  2) 시트에 Apps Script(Code.gs)를 붙여 웹 앱으로 배포한 뒤, 그 실행 URL을 아래
     CONFIG.SCRIPT_URL 에 넣습니다. (이미 종현님의 배포 URL이 연결되어 있습니다)
  3) 구글 드라이브 녹취 파일은 각각 "링크가 있는 모든 사용자 - 뷰어"로 공유합니다.
  4) (선택) CONFIG.FIELDS[].photo 에 분야별 실사진 URL을 넣으면 워크숍 아카이브처럼
     타일 배경 사진으로 표시됩니다. 비워두면 그래픽 타일로 표시됩니다.
  ════════════════════════════════════════════════════════════════
-->

<style>
  :root{
    --ink-950:#08090A;
    --ink-900:#111214;
    --ink-800:#1A1B1E;
    --ink-700:#2A2C30;
    --line:rgba(255,255,255,.12);
    --line-soft:rgba(255,255,255,.07);

    --gold:#C9A227;
    --gold-soft:#D9BB63;
    --cream:#EEEBE3;
    --cream-dim:#9B978D;

    --dance:#D9695E;
    --art:#4A9BC2;
    --music:#9B7FD4;
    --trad:#C79A4E;

    --font:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink-950);
    color:var(--cream);
    font-family:var(--font);
    font-weight:400;
    word-break:keep-all;
    overflow-wrap:break-word;
    min-height:100vh;
  }
  ::selection{background:var(--gold); color:var(--ink-950);}
  button, input, a{font-family:inherit;}
  img{display:block;}
  .hidden{display:none !important;}

  /* ---------- viewfinder corner-mark motif (signature element) ---------- */
  .brackets{position:absolute; inset:16px; pointer-events:none; opacity:0; transition:opacity .2s ease;}
  .brackets i{position:absolute; width:22px; height:22px; border-color:var(--gold);}
  .brackets i:nth-child(1){top:0; left:0; border-top:2px solid; border-left:2px solid;}
  .brackets i:nth-child(2){top:0; right:0; border-top:2px solid; border-right:2px solid;}
  .brackets i:nth-child(3){bottom:0; left:0; border-bottom:2px solid; border-left:2px solid;}
  .brackets i:nth-child(4){bottom:0; right:0; border-bottom:2px solid; border-right:2px solid;}
  .tile:hover .brackets{opacity:1;}

  /* ---------- app shell ---------- */
  #app-screen{min-height:100vh; display:flex; flex-direction:column;}

  header.top-bar{
    position:sticky; top:0; z-index:30;
    background:var(--ink-950);
    border-bottom:1px solid var(--line-soft);
    padding:20px 40px;
    display:flex; align-items:center; gap:28px; flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; cursor:pointer;}
  .brand-name{font-size:18px; font-weight:700;}
  .brand-tag{font-weight:600; font-size:9px; letter-spacing:.2em; color:var(--gold-soft); text-transform:uppercase; margin-top:2px;}

  main{flex:1; width:100%;}
  .content-pad{max-width:1180px; margin:0 auto; padding:0 40px 90px;}

  /* ---------- home layout (title left, tiles right) ---------- */
  .home-layout{display:flex; align-items:flex-start; gap:56px; padding-top:56px; margin-bottom:56px;}
  .home-text{flex:0 0 300px;}
  .hero-eyebrow{font-weight:600; font-size:11px; letter-spacing:.24em; color:var(--gold-soft); text-transform:uppercase; margin-bottom:12px;}
  .hero-title{font-size:clamp(28px, 3.2vw, 38px); font-weight:800; line-height:1.35; margin-bottom:14px;}
  .hero-desc{color:var(--cream-dim); font-size:14.5px; font-weight:400; line-height:1.75;}

  /* ---------- discipline tiles (photo cards) ---------- */
  .tile-grid{flex:1; display:grid; grid-template-columns:repeat(2, 1fr); gap:20px; min-width:0;}
  .tile{
    position:relative; overflow:hidden; cursor:pointer;
    aspect-ratio:16/11; border:1px solid var(--line-soft);
    background:linear-gradient(155deg, var(--ink-800) 0%, var(--ink-900) 100%);
  }
  .tile img{width:100%; height:100%; object-fit:cover; transition:transform .5s ease;
    background:var(--ink-950); filter:brightness(.62) saturate(.92) contrast(1.03);}
  .tile:hover img{transform:scale(1.045);}
  .tile-scrim{
    position:absolute; inset:0;
    background:linear-gradient(0deg, rgba(8,9,10,.96) 0%, rgba(8,9,10,.55) 45%, rgba(8,9,10,.18) 75%);
  }
  .tile-content{position:absolute; left:28px; right:28px; bottom:24px;}
  .tile-eng{font-weight:600; font-size:10px; letter-spacing:.22em; color:var(--gold-soft); text-transform:uppercase;}
  .tile-name{font-size:clamp(24px,2.6vw,32px); font-weight:700; margin:8px 0 6px;}
  .tile-meta{font-weight:500; font-size:12px; color:var(--cream-dim); font-variant-numeric:tabular-nums;}

  /* ---------- record list banner ---------- */
  .list-banner{position:relative; height:180px; overflow:hidden; margin-bottom:36px;
    background:linear-gradient(155deg, var(--ink-800) 0%, var(--ink-950) 100%);}
  .list-banner-content{position:absolute; left:40px; right:40px; bottom:24px; display:flex; align-items:flex-end; gap:18px;}
  .back-btn{
    background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--cream);
    width:38px; height:38px; cursor:pointer; font-size:16px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .back-btn:hover{border-color:var(--gold); color:var(--gold-soft);}
  .list-title-wrap .field-eng{font-weight:600; font-size:11px; letter-spacing:.22em; color:var(--gold-soft); text-transform:uppercase; margin-bottom:6px;}
  .list-title{font-size:clamp(26px,3.2vw,36px); font-weight:800;}

  /* ---------- day rows (magazine-style thin-divider list) ---------- */
  .day-row{
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
    padding:20px 4px; border-bottom:1px solid var(--line-soft);
    transition:padding-left .15s ease;
  }
  .day-row:first-child{padding-top:0;}
  .day-info{display:flex; align-items:center; gap:16px; min-width:180px;}
  .day-bar{width:3px; height:34px; background:var(--c, var(--gold)); flex:0 0 auto;}
  .day-meta{display:flex; flex-direction:column; gap:4px;}
  .meta-primary{font-size:15px; font-weight:600;}
  .meta-sub{font-size:11.5px; font-weight:500; letter-spacing:.02em; color:var(--c, var(--gold-soft)); text-transform:uppercase;}

  .day-actions{display:flex; align-items:center; gap:6px;}
  .divider{width:1px; height:14px; background:var(--line);}

  .link-btn{
    display:inline-flex; align-items:center; gap:7px;
    font-size:12.5px; font-weight:600; letter-spacing:.02em;
    color:var(--cream); text-decoration:none; padding:8px 12px;
    transition:color .15s ease, background .15s ease;
  }
  .link-btn svg{width:14px; height:14px; flex-shrink:0;}
  .link-btn:hover{color:var(--gold-soft); background:rgba(201,162,39,.08);}
  .link-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .link-btn.rec .rec-dot{width:6px; height:6px; border-radius:50%; background:var(--gold); animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}
  .link-btn.disabled{opacity:.35; pointer-events:none;}

  .empty-state{text-align:center; padding:100px 20px; color:var(--cream-dim);}
  .empty-state .big{font-size:22px; font-weight:700; color:var(--cream); margin-bottom:8px;}

  @media (prefers-reduced-motion: reduce){
    .link-btn .rec-dot{animation:none;}
    .tile img{transition:none;}
    .day-row{transition:none;}
  }

  @media (max-width: 900px){
    .home-layout{flex-direction:column; gap:32px;}
    .home-text{flex:none; width:100%;}
  }
  @media (max-width: 720px){
    header.top-bar{padding:16px 20px;}
    .content-pad{padding:0 20px 60px;}
    .list-banner-content{left:20px; right:20px;}
    .tile-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="app-screen">
  <header class="top-bar">
    <div class="brand" id="brand-home">
      <span class="brand-name">K예술영재 프로젝트</span>
      <span class="brand-tag">Faculty Meeting Archive</span>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section id="view-home">
      <div class="content-pad">
        <div class="home-layout">
          <div class="home-text">
            <div class="hero-eyebrow">4 Disciplines</div>
            <div class="hero-title">분야를 선택해 주세요</div>
            <div class="hero-desc">분야별 교강사 회의 일차를 선택하면 해당 회차의 회의록과 녹취 파일을 확인할 수 있습니다.</div>
          </div>
          <div class="tile-grid" id="tile-grid"></div>
        </div>
      </div>
    </section>

    <!-- DAY LIST -->
    <section id="view-list" class="hidden">
      <div class="list-banner">
        <div class="brackets"><i></i><i></i><i></i><i></i></div>
        <div class="list-banner-content">
          <button class="back-btn" id="back-from-list">←</button>
          <div class="list-title-wrap">
            <div class="field-eng" id="field-eng"></div>
            <div class="list-title" id="field-name"></div>
          </div>
        </div>
      </div>
      <div class="content-pad">
        <div id="list-body"></div>
      </div>
    </section>
  </main>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   CONFIG — 종현님이 채워 넣는 부분
   ══════════════════════════════════════════════════════════════ */
const CONFIG = {
  // Apps Script 웹 앱 실행 URL ({headers:[...], rows:[{...}]} 형태의 JSON을 반환)
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbw5AOe2TgmO5yuM2FE_LLUD9cTw02L1G27yOxp9s3njtPSJrOU6ratBacWO5L7juqWEtQ/exec",

  FIELDS: [
    { key:"dance", nameKr:"무용",     nameEn:"BALLET",           color:"var(--dance)", photo:"" },
    { key:"art",   nameKr:"미술",     nameEn:"ARTS",              color:"var(--art)",   photo:"" },
    { key:"music", nameKr:"음악",     nameEn:"MUSIC",             color:"var(--music)", photo:"" },
    { key:"trad",  nameKr:"전통예술", nameEn:"TRADITIONAL ARTS",  color:"var(--trad)",  photo:"" },
  ],

  // 시트 헤더 중 어떤 컬럼이 분야/회의록링크/녹취링크 역할을 하는지 이름으로 자동 인식.
  // 여기 해당하지 않는 나머지 모든 컬럼(순번/회의명/일차/차시/날짜 등)은 그대로 화면에 표시됩니다.
  HEADER_ALIASES: {
    field: ["분야"],
    docs:  ["회의록"],
    audio: ["녹취"],
  }
};

/* ══════════════════════════════════════════════════════════════
   내부 로직 — 수정할 필요 없음
   ══════════════════════════════════════════════════════════════ */
const tileGrid = document.getElementById('tile-grid');
const listBody = document.getElementById('list-body');
const viewHome = document.getElementById('view-home');
const viewList = document.getElementById('view-list');
const fieldEng = document.getElementById('field-eng');
const fieldName= document.getElementById('field-name');

let allRowsPromise = null;

function iconDoc(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6M9 9h1"/></svg>';
}
function iconMic(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>';
}

function showView(name){
  viewHome.classList.toggle('hidden', name !== 'home');
  viewList.classList.toggle('hidden', name !== 'list');
}

function renderTiles(){
  tileGrid.innerHTML = CONFIG.FIELDS.map(f => `
    <div class="tile" data-key="${f.key}" style="--c:${f.color}">
      ${f.photo ? `<img src="${f.photo}" alt="${f.nameKr}"><div class="tile-scrim"></div>` : ''}
      <div class="brackets"><i></i><i></i><i></i><i></i></div>
      <div class="tile-content">
        <div class="tile-eng">${f.nameEn}</div>
        <div class="tile-name">${f.nameKr}</div>
        <div class="tile-meta" id="status-${f.key}">${CONFIG.SCRIPT_URL ? '회차 확인 중…' : '시트 미연동'}</div>
      </div>
    </div>
  `).join('');

  tileGrid.querySelectorAll('.tile').forEach(el=>{
    el.addEventListener('click', ()=> openField(el.dataset.key));
  });

  CONFIG.FIELDS.forEach(f => {
    getRowsForField(f).then(rows=>{
      const el = document.getElementById('status-'+f.key);
      if(!el) return;
      el.textContent = rows === null ? '연결 대기' : `${rows.length}개 회차`;
    });
  });
}

function normalize(s){ return (s||'').toString().trim(); }

function normalizeFieldValue(s){
  return normalize(s).normalize('NFC').replace(/\s+/g,'');
}

function matchHeaderRole(header, aliasList){
  const h = normalize(header).replace(/\s/g,'');
  return aliasList.some(a => h.includes(a.replace(/\s/g,'')));
}

function fetchAllRows(){
  if(!CONFIG.SCRIPT_URL){ return Promise.resolve(null); }
  if(allRowsPromise) return allRowsPromise;

  allRowsPromise = (async ()=>{
    try{
      const res = await fetch(CONFIG.SCRIPT_URL);
      const json = await res.json();
      if(json.error){ console.error('Apps Script 오류:', json.error); return []; }

      const headers = json.headers || [];
      if(headers.length === 0) return [];

      // 헤더 이름으로 역할 자동 분류: 분야 / 회의록 링크 / 녹취 링크 / 그 외(표시용)
      let fieldKey = null, docsKey = null, audioKey = null;
      const displayKeys = [];
      headers.forEach(h=>{
        if(matchHeaderRole(h, CONFIG.HEADER_ALIASES.field) && !fieldKey){ fieldKey = h; return; }
        if(matchHeaderRole(h, CONFIG.HEADER_ALIASES.docs) && !docsKey){ docsKey = h; return; }
        if(matchHeaderRole(h, CONFIG.HEADER_ALIASES.audio) && !audioKey){ audioKey = h; return; }
        displayKeys.push(h);
      });

      const rawRows = (json.rows || []).map(row => ({
        field: normalize(row[fieldKey]),
        docs:  normalize(row[docsKey]),
        audio: normalize(row[audioKey]),
        display: displayKeys
          .map(k => ({ label: k, value: normalize(row[k]) }))
          .filter(d => d.value !== ''),
      }));

      // "분야" 셀을 병합해서 첫 행에만 값을 넣은 경우, 병합된 나머지 행은 빈 값으로
      // 내려오므로 바로 위 행의 분야 값을 이어받는다.
      let lastField = '';
      rawRows.forEach(r => {
        if(r.field){ lastField = r.field; } else { r.field = lastField; }
      });

      return rawRows.filter(r => r.field && r.display.length > 0);
    }catch(err){
      console.error('Apps Script 로딩 실패:', err);
      return [];
    }
  })();

  return allRowsPromise;
}

async function getRowsForField(field){
  const rows = await fetchAllRows();
  if(rows === null) return null;
  const target = normalizeFieldValue(field.nameKr);
  return rows.filter(r => normalizeFieldValue(r.field) === target);
}

async function openField(key){
  const field = CONFIG.FIELDS.find(f=>f.key===key);
  if(!field) return;

  fieldEng.textContent = field.nameEn;
  fieldName.textContent = field.nameKr + ' 교강사 회의록·녹취';
  document.querySelector('.list-banner').style.setProperty('--c', field.color);

  showView('list');
  listBody.innerHTML = `<div class="empty-state"><div class="big">불러오는 중입니다…</div></div>`;

  const rows = await getRowsForField(field);

  if(rows === null){
    listBody.innerHTML = `<div class="empty-state"><div class="big">시트가 아직 연결되지 않았습니다</div>파일 상단의 CONFIG.SCRIPT_URL 값을 채워 넣으면 회차별 링크가 표시됩니다.</div>`;
    return;
  }
  if(rows.length === 0){
    listBody.innerHTML = `<div class="empty-state"><div class="big">등록된 회차가 없습니다</div>스프레드시트의 "분야" 열에 "${field.nameKr}"으로 표시된 행에 내용을 입력해 주세요.</div>`;
    return;
  }

  listBody.innerHTML = rows.map(r=>{
    const hasDocs = !!r.docs;
    const hasAudio = !!r.audio;
    const [primary, ...rest] = r.display;
    return `
      <div class="day-row" style="--c:${field.color}">
        <div class="day-info">
          <div class="day-bar"></div>
          <div class="day-meta">
            ${primary ? `<div class="meta-primary">${primary.value}</div>` : ''}
            ${rest.length ? `<div class="meta-sub">${rest.map(d=>`${d.label} ${d.value}`).join(' · ')}</div>` : ''}
          </div>
        </div>
        <div class="day-actions">
          <a class="link-btn ${hasDocs?'':'disabled'}" ${hasDocs?`href="${r.docs}" target="_blank" rel="noopener"`:''}>
            ${iconDoc()} ${hasDocs ? '회의록 보기' : '회의록 준비중'}
          </a>
          <span class="divider"></span>
          <a class="link-btn rec ${hasAudio?'':'disabled'}" ${hasAudio?`href="${r.audio}" target="_blank" rel="noopener"`:''}>
            ${hasAudio ? '<span class="rec-dot"></span>' : iconMic()} ${hasAudio ? '녹취 듣기' : '녹취 준비중'}
          </a>
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('back-from-list').addEventListener('click', ()=> showView('home'));
document.getElementById('brand-home').addEventListener('click', ()=> showView('home'));

renderTiles();
</script>
</body>
</html>
