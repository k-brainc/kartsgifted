<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2026 K예술영재 프로젝트</title>
<meta name="description" content="문화체육관광부 주최 2026 K예술영재 프로젝트 - 음악·무용·전통예술·미술 네 분야 예술영재를 조기 발굴하고 무대까지 성장을 지원합니다.">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --teal:#176C86; --teal-dark:#124f61; --teal-tint:#EAF3F5;
    --ink:#212326; --ink-2:#55595e; --ink-3:#8a8f94;
    --bg:#ffffff; --bg-soft:#F6F8F9; --line:#E5E8EA;
    --music:#C1543A; --dance:#B1708F; --trad:#3F7D5C; --art:#3F6EA0;
    --sans:'PretendardVariable','Pretendard-Regular','Pretendard', -apple-system, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;word-break:keep-all;overflow:hidden;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 32px;width:100%;}
  ::selection{background:var(--teal);color:#fff;}

  /* ---------- scroll-snap shell ---------- */
  #snap{
    height:100vh;height:100dvh;overflow-y:scroll;overflow-x:hidden;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
  }
  .snap-section{
    position:relative;min-height:100vh;min-height:100dvh;
    scroll-snap-align:start;scroll-snap-stop:always;
    display:flex;flex-direction:column;justify-content:center;
    overflow:hidden;
  }
  .snap-section .sec-scroll{
    position:relative;z-index:2;
    width:100%;max-height:100vh;max-height:100dvh;overflow-y:auto;
    padding:96px 0 48px;
  }
  .snap-section .sec-scroll::-webkit-scrollbar{width:0;height:0;}

  /* ---------- section background layer ---------- */
  .sec-bg{position:absolute;inset:0;z-index:0;}
  .sec-bg .layer{position:absolute;inset:0;}
  .sec-bg img.bgimg, .sec-bg video.bgvid{width:100%;height:100%;object-fit:cover;}
  .sec-bg iframe.bgyt{position:absolute;top:50%;left:50%;width:185vh;height:60vw;min-width:145%;min-height:145%;transform:translate(-50%,-50%);pointer-events:none;}
  .sec-bg .overlay{position:absolute;inset:0;background:rgba(0,0,0,0);}
  .grad-hero{background:linear-gradient(160deg,#0b3644 0%,#12566a 42%,#176C86 75%,#1c8aa9 100%);}
  .grad-hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 30% 20%, rgba(255,255,255,0.10), transparent 55%),radial-gradient(ellipse 60% 50% at 80% 85%, rgba(0,0,0,0.18), transparent 60%);}

  /* ---------- header / GNB ---------- */
  header.gnb{
    position:fixed;top:0;left:0;right:0;z-index:200;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 40px;height:72px;
    transition:background .3s ease, box-shadow .3s ease, height .3s ease;
    border-bottom:1px solid transparent;
  }
  header.gnb.solid{background:#fff;height:62px;border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(20,30,35,0.04);}
  header.gnb .logo{font-weight:800;font-size:19px;letter-spacing:-.01em;color:#fff;transition:color .3s ease;display:flex;align-items:center;gap:8px;}
  header.gnb.solid .logo{color:var(--ink);}
  header.gnb .logo .badge{background:var(--teal);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;}
  nav.menu{display:flex;gap:36px;}
  nav.menu a{font-size:14.5px;font-weight:600;color:rgba(255,255,255,0.92);transition:color .3s ease;cursor:pointer;}
  header.gnb.solid nav.menu a{color:var(--ink-2);}
  nav.menu a:hover{color:#fff;} header.gnb.solid nav.menu a:hover{color:var(--teal);}
  .gnb-cta{background:var(--teal);color:#fff;font-size:13.5px;font-weight:700;padding:10px 20px;border-radius:3px;cursor:pointer;}
  .gnb-cta:hover{background:var(--teal-dark);}

  /* ---------- dot nav ---------- */
  .dotnav{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:200;display:flex;flex-direction:column;gap:16px;}
  .dotnav .dot{width:9px;height:9px;border-radius:50%;background:rgba(120,130,135,0.35);cursor:pointer;transition:all .25s;position:relative;}
  .dotnav .dot .lbl{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--ink);background:#fff;padding:4px 10px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.1);opacity:0;pointer-events:none;transition:opacity .2s;}
  .dotnav .dot:hover .lbl{opacity:1;}
  .dotnav .dot.active{background:var(--teal);transform:scale(1.35);}

  /* ---------- hero content ---------- */
  .hero .content{position:relative;z-index:2;padding:0 24px;max-width:760px;margin:0 auto;text-align:center;color:#fff;}
  .hero .eyebrow{font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;margin-bottom:22px;opacity:.92;}
  .hero h1{font-size:clamp(30px,5.6vw,56px);font-weight:800;line-height:1.32;letter-spacing:-.01em;margin-bottom:22px;text-shadow:0 2px 24px rgba(0,0,0,.25);white-space:pre-line;}
  .hero p{font-size:clamp(15px,1.7vw,17px);color:rgba(255,255,255,0.9);margin-bottom:30px;}
  .hero-chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:30px;}
  .hero-chips span{font-size:12.5px;font-weight:600;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.35);padding:8px 16px;border-radius:100px;}
  .hero-ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn{padding:14px 28px;font-size:14.5px;font-weight:700;border-radius:3px;transition:all .2s ease;cursor:pointer;display:inline-block;}
  .btn-solid{background:#fff;color:var(--teal-dark);} .btn-solid:hover{background:var(--teal-tint);}
  .btn-line{border:1.5px solid rgba(255,255,255,0.75);color:#fff;} .btn-line:hover{background:rgba(255,255,255,0.12);}
  .scroll-ind{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,0.85);font-weight:600;}
  .scroll-ind .dot{width:1px;height:26px;background:rgba(255,255,255,0.6);position:relative;overflow:hidden;}
  .scroll-ind .dot::after{content:'';position:absolute;top:-100%;left:0;width:100%;height:100%;background:#fff;animation:scrolldown 1.6s ease-in-out infinite;}
  @keyframes scrolldown{0%{top:-100%;}60%{top:100%;}100%{top:100%;}}

  /* ---------- generic section head ---------- */
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px;flex-wrap:wrap;gap:16px;}
  .sec-head .eyebrow{font-size:12.5px;font-weight:800;color:var(--teal);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;}
  .sec-head h2{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.01em;}
  .sec-head .desc{color:var(--ink-2);font-size:14px;margin-top:8px;max-width:520px;}
  .more-link{font-size:13.5px;font-weight:700;color:var(--ink-2);border-bottom:1.5px solid var(--ink);padding-bottom:2px;white-space:nowrap;cursor:pointer;}
  .more-link:hover{color:var(--teal);border-color:var(--teal);}
  .on-media .sec-head h2, .on-media .sec-head .eyebrow{color:#fff;}
  .on-media .sec-head .desc{color:rgba(255,255,255,0.85);}
  .on-media .more-link{color:#fff;border-color:#fff;}

  /* ---------- intro ---------- */
  .intro-quote{background:var(--teal-tint);border-radius:6px;padding:34px 38px;margin-bottom:38px;border-left:4px solid var(--teal);}
  .intro-quote p{font-size:clamp(17px,2.1vw,22px);font-weight:700;color:var(--teal-dark);line-height:1.55;white-space:pre-line;}
  .intro-quote span{display:block;margin-top:12px;font-size:12.5px;color:var(--ink-3);font-weight:600;}
  .figures-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:38px;}
  .figure{border:1px solid var(--line);border-radius:6px;padding:16px 16px;background:rgba(255,255,255,0.9);}
  .figure .name{font-weight:800;font-size:15px;} .figure .role{font-size:11.5px;color:var(--ink-3);margin-top:3px;}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .stat-cell{padding:22px 14px;text-align:center;border-left:1px solid var(--line);}
  .stat-cell:first-child{border-left:none;}
  .stat-cell .n{font-size:clamp(22px,2.4vw,30px);font-weight:800;color:var(--teal);} .stat-cell .l{font-size:12px;color:var(--ink-2);margin-top:5px;}
  .on-media .figure{background:rgba(255,255,255,0.94);}

  /* ---------- fields (program cards) ---------- */
  .card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .prog-card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:box-shadow .25s ease, transform .25s ease;}
  .prog-card:hover{box-shadow:0 12px 28px rgba(20,40,50,0.09);transform:translateY(-3px);}
  .prog-card .band{height:6px;background:var(--accent);}
  .prog-card .body{padding:22px 20px 20px;}
  .prog-card .tag{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
  .prog-card h3{font-size:19px;font-weight:800;margin-bottom:2px;} .prog-card .en{font-size:11px;color:var(--ink-3);margin-bottom:14px;font-weight:600;}
  .prog-card ul{list-style:none;margin-bottom:14px;}
  .prog-card li{font-size:12.5px;color:var(--ink-2);padding:5px 0;border-bottom:1px dashed var(--line);}
  .prog-card .age{font-size:11.5px;color:var(--ink-2);background:var(--bg-soft);border-radius:4px;padding:9px 11px;}
  .prog-card .age b{color:var(--accent);display:block;font-size:12px;margin-bottom:2px;}

  /* ---------- journey steps ---------- */
  .step-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .step-card{border:1px solid var(--line);border-radius:8px;padding:26px 22px;background:#fff;transition:box-shadow .25s ease;}
  .step-card:hover{box-shadow:0 12px 28px rgba(20,40,50,0.08);}
  .step-card .step-no{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;font-size:13px;margin-bottom:14px;}
  .step-card .when{font-size:12px;font-weight:700;color:var(--teal);margin-bottom:6px;}
  .step-card h3{font-size:17.5px;font-weight:800;margin-bottom:8px;} .step-card p{font-size:13px;color:var(--ink-2);margin-bottom:14px;}
  .step-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .step-tags span{font-size:11px;background:var(--bg-soft);color:var(--ink-2);padding:4px 9px;border-radius:100px;border:1px solid var(--line);}

  /* ---------- board ---------- */
  .board-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:44px;}
  .board-list{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .board-row{display:grid;grid-template-columns:60px 1fr 110px;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px;}
  .board-row:last-child{border-bottom:none;}
  .board-row.head{background:var(--bg-soft);font-weight:700;color:var(--ink-3);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;}
  .board-row .no{color:var(--teal);font-weight:800;} .board-row .tt{font-weight:600;}
  .board-row .tt small{display:block;color:var(--ink-3);font-weight:400;font-size:11.5px;margin-top:2px;}
  .board-row .dt{color:var(--ink-3);text-align:right;white-space:nowrap;}
  .info-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px 24px;}
  .info-card h4{font-size:15px;font-weight:800;margin-bottom:14px;}
  .info-line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
  .info-line:last-child{border-bottom:none;}
  .info-line .k{color:var(--ink-3);font-weight:600;flex-shrink:0;} .info-line .v{color:var(--ink);text-align:right;}
  .info-line a.v{color:var(--teal);font-weight:600;}

  /* ---------- gallery ---------- */
  .gal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .gal-item{aspect-ratio:1/1;border-radius:6px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px;color:#fff;}
  .gal-item .cap{position:relative;z-index:2;font-size:12px;font-weight:700;line-height:1.4;}
  .gal-item::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.55) 100%);z-index:1;}
  .gal-item .base{position:absolute;inset:0;}
  .gal-item .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.92);display:flex;align-items:center;justify-content:center;}
  .gal-item .play::after{content:'';border-left:10px solid var(--teal-dark);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px;}
  .gal-cta{text-align:center;margin-top:22px;}

  /* ---------- footer ---------- */
  footer{background:#16232a;color:#c7ced1;padding:48px 0 0;}
  .foot-grid{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:28px;padding-bottom:32px;border-bottom:1px solid rgba(255,255,255,0.1);}
  .foot-brand{font-size:18px;font-weight:800;color:#fff;margin-bottom:10px;}
  .foot-brand-desc{font-size:12px;color:#8b969b;line-height:1.7;}
  .foot-col h5{font-size:12px;font-weight:700;color:#fff;margin-bottom:12px;letter-spacing:.04em;}
  .foot-col a{display:block;font-size:12.5px;color:#a9b2b6;padding:5px 0;}
  .foot-col a:hover{color:#fff;}
  .foot-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:20px 0 26px;font-size:11.5px;color:#758085;}

  .src-badge{position:fixed;left:14px;bottom:14px;z-index:300;font-size:10.5px;background:rgba(0,0,0,0.55);color:#fff;padding:5px 10px;border-radius:100px;letter-spacing:.03em;opacity:.75;}

  @media(max-width:960px){
    nav.menu{display:none;} .dotnav{display:none;}
    .figures-row{grid-template-columns:repeat(2,1fr);}
    .stat-row{grid-template-columns:repeat(2,1fr);} .stat-cell:nth-child(3){border-left:none;}
    .card-grid{grid-template-columns:1fr;} .step-grid{grid-template-columns:1fr;}
    .board-grid{grid-template-columns:1fr;gap:30px;} .gal-grid{grid-template-columns:repeat(2,1fr);}
    .foot-grid{grid-template-columns:1fr 1fr;}
    .wrap{padding:0 22px;}
    .snap-section .sec-scroll{padding:80px 0 40px;}
  }
</style>
</head>
<body>

<header class="gnb" id="siteHeader">
  <a class="logo" data-nav="hero">K예술영재<span class="badge" id="hdrBadge">2026</span></a>
  <nav class="menu">
    <a data-nav="intro">프로젝트 소개</a>
    <a data-nav="fields">모집분야</a>
    <a data-nav="journey">프로그램</a>
    <a data-nav="board">지원안내</a>
    <a data-nav="gallery">갤러리</a>
  </nav>
  <a class="gnb-cta" data-nav="board">지원하기</a>
</header>

<div class="dotnav" id="dotNav"></div>
<div class="src-badge" id="srcBadge" style="display:none;"></div>

<div id="snap">
  <!-- HERO -->
  <section class="snap-section hero" id="hero" data-section="hero">
    <div class="sec-bg" id="bg-hero"></div>
    <div class="content">
      <div class="eyebrow" id="heroEyebrow"></div>
      <h1 id="heroTitle"></h1>
      <p id="heroSubtitle"></p>
      <div class="hero-chips" id="heroChips"></div>
      <div class="hero-ctas">
        <a class="btn btn-solid" data-nav="board">지원 요강 보기</a>
        <a class="btn btn-line" data-nav="journey">프로그램 살펴보기</a>
      </div>
    </div>
    <div class="scroll-ind"><span>SCROLL</span><span class="dot"></span></div>
  </section>

  <!-- INTRO -->
  <section class="snap-section" id="intro" data-section="intro">
    <div class="sec-bg" id="bg-intro"></div>
    <div class="sec-scroll"><div class="wrap">
      <div class="sec-head">
        <div>
          <div class="eyebrow" id="introEyebrow"></div>
          <h2 id="introHeading"></h2>
          <p class="desc" id="introDesc"></p>
        </div>
      </div>
      <div class="intro-quote"><p id="introQuote"></p><span id="introQuoteSrc"></span></div>
      <div class="figures-row" id="figuresRow"></div>
      <div class="stat-row" id="statRow"></div>
    </div></div>
  </section>

  <!-- FIELDS -->
  <section class="snap-section" id="fields" data-section="fields">
    <div class="sec-bg" id="bg-fields"></div>
    <div class="sec-scroll"><div class="wrap">
      <div class="sec-head">
        <div><div class="eyebrow" id="fieldsEyebrow"></div><h2 id="fieldsHeading"></h2><p class="desc" id="fieldsDesc"></p></div>
      </div>
      <div class="card-grid" id="cardGrid"></div>
    </div></div>
  </section>

  <!-- JOURNEY -->
  <section class="snap-section" id="journey" data-section="journey">
    <div class="sec-bg" id="bg-journey"></div>
    <div class="sec-scroll"><div class="wrap">
      <div class="sec-head">
        <div><div class="eyebrow" id="journeyEyebrow"></div><h2 id="journeyHeading"></h2><p class="desc" id="journeyDesc"></p></div>
      </div>
      <div class="step-grid" id="stepGrid"></div>
    </div></div>
  </section>

  <!-- BOARD -->
  <section class="snap-section" id="board" data-section="board">
    <div class="sec-bg" id="bg-board"></div>
    <div class="sec-scroll"><div class="wrap">
      <div class="sec-head">
        <div><div class="eyebrow" id="boardEyebrow"></div><h2 id="boardHeading"></h2><p class="desc" id="boardDesc"></p></div>
        <a class="more-link" id="boardMore" target="_blank" rel="noopener">공고문 전체보기 →</a>
      </div>
      <div class="board-grid">
        <div class="board-list" id="boardList"></div>
        <div class="info-card" id="infoCard"></div>
      </div>
    </div></div>
  </section>

  <!-- GALLERY -->
  <section class="snap-section" id="gallery" data-section="gallery">
    <div class="sec-bg" id="bg-gallery"></div>
    <div class="sec-scroll"><div class="wrap">
      <div class="sec-head">
        <div><div class="eyebrow" id="galleryEyebrow"></div><h2 id="galleryHeading"></h2><p class="desc" id="galleryDesc"></p></div>
        <a class="more-link" id="galleryMore" target="_blank" rel="noopener">유튜브 채널 →</a>
      </div>
      <div class="gal-grid" id="galGrid"></div>
      <div class="gal-cta"><a class="btn" id="galCta" target="_blank" rel="noopener" style="border:1.5px solid var(--line);color:var(--ink);">유튜브에서 더 보기 ↗</a></div>
    </div></div>
  </section>

  <!-- FOOTER (last snap stop) -->
  <section class="snap-section" id="footerSec" data-section="footerSec" style="min-height:auto;">
    <footer style="width:100%;">
      <div class="wrap">
        <div class="foot-grid" id="footGrid"></div>
        <div class="foot-bottom" id="footBottom"></div>
      </div>
    </footer>
  </section>
</div>

<script>
/* ===================== DEFAULT DATA ===================== */
const DEFAULT_DATA = {
  meta:{ title:"2026 K예술영재 프로젝트", badge:"2026" },
  sections:{
    hero:{
      bg:{type:"gradient"}, eyebrow:"문화체육관광부 주최 · 2026",
      title:"잘하는 아이에서,\n표현하는 아티스트로",
      subtitle:"음악·무용·전통예술·미술, 네 분야의 예술영재를 전국에서 발굴하고\n워크숍부터 겨울 캠프까지 국가가 지원하는 성장의 무대를 엽니다.",
      chips:["모집기간 2026.5.18–6.5","대상 초4~고2","4개 분야","참가비 무료"]
    },
    intro:{

/* ===================== LOAD DATA (priority: data.json > localStorage draft > default) ===================== */
async function loadData(){
  try{
    const res = await fetch('data.json', {cache:'no-store'});
    if(res.ok){
      const json = await res.json();
      showSrcBadge('data.json 발행본');
      return json;
    }
  }catch(e){}
  try{
    const draft = localStorage.getItem('kgifted_draft');
    if(draft){ showSrcBadge('임시저장 미리보기 (관리자 draft)'); return JSON.parse(draft); }
  }catch(e){}
  showSrcBadge('기본 샘플 데이터');
  return DEFAULT_DATA;
}
function showSrcBadge(text){
  const params = new URLSearchParams(location.search);
  if(params.get('preview') === '1'){
    const el = document.getElementById('srcBadge');
    el.textContent = text; el.style.display = 'block';
  }
}

/* ===================== YOUTUBE HELPER ===================== */
function getYouTubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}

/* ===================== BACKGROUND RENDERER ===================== */
function renderBg(container, bg, isHeroGrad){
  container.innerHTML = '';
  const type = (bg && bg.type) || 'gradient';
  if(type === 'gradient'){
    const layer = document.createElement('div');
    layer.className = 'layer ' + (isHeroGrad ? 'grad-hero' : '');
    if(!isHeroGrad) layer.style.background = 'linear-gradient(160deg,#12566a,#176C86)';
    container.appendChild(layer);
    container.closest('.snap-section').classList.add('on-media');
    return;
  }
  container.closest('.snap-section').classList.add('on-media');
  if(type === 'image' && bg.url){
    const img = document.createElement('img');
    img.className = 'bgimg'; img.src = bg.url; img.alt = '';
    container.appendChild(img);
  } else if(type === 'video' && bg.url){
    const vid = document.createElement('video');
    vid.className = 'bgvid'; vid.src = bg.url; vid.autoplay = true; vid.muted = true; vid.loop = true; vid.playsInline = true;
    container.appendChild(vid);
  } else if(type === 'youtube' && bg.url){
    const id = getYouTubeId(bg.url);
    if(id){
      const iframe = document.createElement('iframe');
      iframe.className = 'bgyt';
      iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&showinfo=0&modestbranding=1&playsinline=1&rel=0&iv_load_policy=3&cc_load_policy=0&disablekb=1&fs=0&cc_lang_pref=00&hl=en`;
      iframe.setAttribute('frameborder','0');
      iframe.setAttribute('allow','autoplay; encrypted-media; fullscreen');
      iframe.setAttribute('tabindex','-1');
      container.appendChild(iframe);
    }
  } else {
    const layer = document.createElement('div');
    layer.style.background = 'linear-gradient(160deg,#12566a,#176C86)';
    layer.className = 'layer';
    container.appendChild(layer);
  }
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.style.background = `rgba(0,0,0,${bg.overlay != null ? bg.overlay : 0.35})`;
  container.appendChild(overlay);
}

function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===================== NAV / DOTS ===================== */
function buildDotNav(){
  const nav = document.getElementById('dotNav');
  nav.innerHTML = '';
  document.querySelectorAll('.snap-section').forEach(sec=>{
    const key = sec.dataset.section;
    const dot = document.createElement('div');
    dot.className = 'dot'; dot.dataset.target = key;
    dot.innerHTML = `<span class="lbl">${SECTION_LABELS[key]||key}</span>`;
    dot.addEventListener('click', ()=> gotoSection(key));
    nav.appendChild(dot);
  });
}
function bindNav(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.preventDefault(); gotoSection(el.dataset.nav); });
  });
}
function gotoSection(key){
  const el = document.getElementById(key);
  if(el) el.scrollIntoView({behavior:'smooth'});
}
function updateActiveDot(){
  const snap = document.getElementById('snap');
  const mid = snap.scrollTop + snap.clientHeight/2;
  let current = null;
  document.querySelectorAll('.snap-section').forEach(sec=>{
    if(sec.offsetTop <= mid) current = sec.dataset.section;
  });
  document.querySelectorAll('.dotnav .dot').forEach(d=> d.classList.toggle('active', d.dataset.target === current));
  const header = document.getElementById('siteHeader');
  header.classList.toggle('solid', snap.scrollTop > 40 && current !== 'hero');
}

/* ===================== INIT ===================== */
(async function init(){
  const data = await loadData();
  render(data);
  const snap = document.getElementById('snap');
  snap.addEventListener('scroll', updateActiveDot);
  updateActiveDot();
})();
